name: Check and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  # Never cancel a production deploy halfway; superseded PR runs can go.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.mode.outputs.configured }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for sitemap <lastmod> dates
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # A site has BRAND set in site.config.json. The untouched template has not: there we test the
      # template itself on a fixture site instead of deploying it.
      - id: mode
        run: node -e 'const c=require("./site.config.json");console.log("configured="+Boolean(String(c.BRAND||"").trim()))' >> "$GITHUB_OUTPUT"

      - name: Template self-test (node tools/selftest.mjs --lighthouse)
        if: steps.mode.outputs.configured != 'true'
        run: node tools/selftest.mjs --lighthouse

      # One command, the same one people run locally: build, release checks, HTML validation,
      # internal links and Lighthouse budgets. Tool versions are pinned in tools/lib.mjs.
      # Lighthouse audits only the pages this push (or PR) changed; Run workflow by hand audits all.
      - name: Verify (node tools/verify.mjs --lighthouse)
        if: steps.mode.outputs.configured == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node tools/verify.mjs --lighthouse ${BASE:+--base=$BASE}

      - name: Keep Lighthouse report
        if: always() && steps.mode.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: .lighthouseci
          if-no-files-found: ignore

      - if: steps.mode.outputs.configured == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
      - if: steps.mode.outputs.configured == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.configured == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  after-deploy:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Smoke test live site
        run: |
          url="${{ needs.deploy.outputs.page_url }}"
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url") && [ "$code" = 200 ] && echo "$url -> 200" && exit 0
            echo "$url -> $code, retrying"; sleep 10
          done
          exit 1
      - name: Notify search engines (IndexNow -> Bing, ChatGPT search, Copilot)
        continue-on-error: true
        run: node tools/indexnow.mjs "${{ github.event.before }}"
      # Keeps the form emails in step with emails/ on every deploy. Optional: needs the repo secrets
      # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (publish skill, "Form worker deploys from CI").
      - name: Deploy contact form worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "No CLOUDFLARE_API_TOKEN secret: the worker is deployed by hand (node tools/form-worker.mjs deploy)."; exit 0; fi
          node tools/form-worker.mjs deploy --ci
